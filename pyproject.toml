[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photovault"
version = "0.1.0"
description = "Local-first photo backup integrity and multi-disk catalog manager"
requires-python = ">=3.11"

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
photo-intelligence = ["Pillow>=10", "numpy>=2"]
ml = ["Pillow>=10", "numpy>=2", "onnxruntime>=1.18"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
photovault = "photovault.cli.main:main"
photovault-app = "photovault.app:main"
photovault-gui = "photovault.ui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
