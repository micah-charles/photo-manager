<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Collage</title>
<style>body{font:15px system-ui;margin:0;background:#f5f2ed;color:#292521}main{max-width:1200px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid #ded7ce;border-radius:14px;padding:18px;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,input,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #c9c0b5;background:#fff}button.primary{background:#302b26;color:#fff}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.photo{border:2px solid transparent;border-radius:10px;padding:5px;background:#faf9f7}.photo.selected{border-color:#286e67}.photo img{width:100%;aspect-ratio:1.2;object-fit:cover;border-radius:6px}.providers{display:flex;gap:14px;flex-wrap:wrap}.muted{color:#756d64}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.candidate{background:#fff;border-radius:12px;padding:8px}.candidate img{width:100%;display:block;border-radius:8px}.hidden{display:none}</style></head>
<body><main><header><div><div class="muted">EXPERIMENTAL — SMART COLLAGE</div><h1>Content-aware collage lab</h1><p class="muted">Choose a catalog folder, providers and candidate count. Originals are never changed.</p></div><a href="/">← Photo Library</a></header>
<section class="panel"><div class="row"><label>Folder <select id="folders"><option>Loading folders…</option></select></label><button id="load">Load photos</button><button id="all">Select all</button><button id="clear">Clear</button></div><p id="count" class="muted">Selected: 0</p><div id="photos" class="photos"></div><hr><div class="row"><strong>Layout providers</strong><span class="muted">Select one or more</span></div><div class="providers"><label><input type="checkbox" name="provider" value="native" checked> Native</label><label><input type="checkbox" name="provider" value="cewe-genetic" checked> CEWE Fan genetic</label><label><input type="checkbox" name="provider" value="bsp" checked> BSP</label><label>Candidates/provider <input id="candidate-count" type="number" min="1" max="30" value="10" style="width:70px"></label></div><div class="row"><button id="generate" class="primary" disabled>Generate collages</button><span id="status" class="muted"></span></div></section>
<section id="results" class="panel hidden"><div class="row"><h2>Candidate gallery</h2><button id="regenerate">Regenerate</button><button id="change">Change photos</button><label><input id="show-rejected" type="checkbox"> Show rejected</label></div><div id="metrics" class="muted"></div><div id="gallery" class="gallery"></div></section></main><script src="/collage_v2.js?v=20260903-1"></script></body></html>
