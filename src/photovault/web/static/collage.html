<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental Smart Collage</title><style>
body{font:15px system-ui;margin:0;background:#f5f2ed;color:#292521}main{max-width:1200px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#887d70}h1{margin:4px 0 6px}.panel{background:#fff;border:1px solid #ded7ce;border-radius:14px;padding:18px;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #c9c0b5;background:#fff}button.primary{background:#302b26;color:#fff}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.photo{border:2px solid transparent;border-radius:10px;padding:5px;background:#faf9f7}.photo.selected{border-color:#286e67}.photo img{width:100%;aspect-ratio:1.2;object-fit:cover;border-radius:6px}.photo label{display:block}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.candidate{background:#fff;border-radius:12px;padding:8px}.candidate img{width:100%;display:block;border-radius:8px}.muted{color:#756d64}.hidden{display:none}.status{white-space:pre-wrap}.back{color:#286e67;text-decoration:none}
